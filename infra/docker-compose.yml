# Lokalny backend MobileLens - bez domeny, certyfikatów i pliku .env.
#
#   cd infra
#   docker compose -f docker-compose.local.yml up -d --build
#   cd .. && bash admin.sh            # konta testowe + marki + telefony
#
# API i pliki (/media) są pod:  http://localhost:8080
# Frontend na innym porcie/hoście? Dopisz go:  ALLOWED_ORIGINS=http://localhost:3000 docker compose -f docker-compose.local.yml up -d
# Reset do zera:  docker compose -f docker-compose.local.yml down -v
name: mobilelens-local

services:

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro,z
      - media-data:/srv/media:ro
    depends_on:
      api:
        condition: service_healthy

  migrate:
    build:
      context: ../api
      dockerfile: Dockerfile
      target: builder
    restart: "no"
    environment:
      - DATABASE_PATH=/app/data/db.sqlite
    volumes:
      - sqlite-data:/app/data
    command: ["npx", "drizzle-kit", "migrate"]

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_PATH=/app/data/db.sqlite
      - STORAGE_DIR=/app/storage
      - BETTER_AUTH_SECRET=local-dev-secret-local-dev-secret-local-dev-secret-1234
      - API_BASE_URL=http://localhost:8080
      - PUBLIC_MEDIA_URL=http://localhost:8080/media
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://localhost:3000,http://localhost:4173}
      - EMAIL_VERIFICATION=false
      - AUTO_AGGREGATION=false
    volumes:
      - sqlite-data:/app/data
      - media-data:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  sqlite-data:
  media-data:
