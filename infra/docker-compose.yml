services:

  caddy:
    image: caddy:2
    restart: unless-stopped
    mem_limit: 96m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      - media-data:/srv/media:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal
    depends_on:
      api:
        condition: service_healthy

  migrate:
    build:
      context: ../api
      dockerfile: Dockerfile
      target: builder
    restart: "no"
    env_file:
      - ../.env
    environment:
      - DATABASE_PATH=/app/data/db.sqlite
    volumes:
      - sqlite-data:/app/data
    command: ["npx", "drizzle-kit", "migrate"]
    networks:
      - internal

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    restart: unless-stopped
    # Limity dobrane pod VPS z 1 GiB RAM (Standard B2ats v2). Upload jest strumieniowy,
    # więc API nie wczytuje plików do pamięci; pliki tymczasowe i docelowe lądują na dysku
    # (wolumen media-data, ten sam, który Caddy serwuje pod /media/*).
    mem_limit: 384m
    env_file:
      - ../.env
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=192
      - DATABASE_PATH=/app/data/db.sqlite
      - STORAGE_DIR=/app/storage
    volumes:
      - sqlite-data:/app/data
      - media-data:/app/storage
    networks:
      - internal
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  sqlite-data:
  media-data:
  caddy-data:
  caddy-config:

networks:
  internal:
    driver: bridge
